# TMTB (VMamba) Model Configuration
# Model-specific settings for TMTB crowd counting

model:
  # Model identifier
  name: "tmtb"

  # Checkpoint path (relative to project root)
  checkpoint: "ml/fine-tunned-models/tmtb_jhu_corrected.pth"

  # Model architecture parameters
  architecture:
    # VMamba-based TMTB model
    backbone: "vmamba"
    # Number of output classes/channels
    num_classes: 25
    # Output channels (1 for density map)
    output_channels: 1

# Input preprocessing
preprocessing:
  # Dimension settings for different input sources
  # Each source has length (width) and breadth (height) in pixels
  # These values are optimized for TMTB performance (384px for real-time)

  image:
    length: 80 # Width for uploaded images
    breadth: 80 # Height for uploaded images

  webcam:
    length: 38 # Width for webcam frames (optimized for speed)
    breadth: 38 # Height for webcam frames

  video:
    length: 38 # Width for video frames
    breadth: 38 # Height for video frames

  surveillance:
    length: 38 # Width for surveillance camera
    breadth: 38 # Height for surveillance camera

  # ImageNet normalization parameters
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  # Resize mode
  resize_mode: "bilinear" # Options: bilinear, bicubic

# Inference settings
inference:
  # Precision mode
  precision: "fp32" # Options: fp32, fp16 (fp16 needs GPU)

  # Batch size for batch inference
  batch_size: 1

  # Enable model warmup on load
  warmup: true

  # Warmup iterations
  warmup_iterations: 3

  # Enable gradient computation (usually false for inference)
  requires_grad: false

# Performance optimization
optimization:
  # CPU-first loading strategy (avoids 15+ min GPU init overhead)
  cpu_first_loading: true

  # Enable torch.compile (PyTorch 2.0+)
  compile_model: false

  # Compilation mode
  compile_mode: "default" # Options: default, reduce-overhead, max-autotune

  # Enable channels_last memory format
  channels_last: false

  # Enable cudnn benchmark
  cudnn_benchmark: true

  # Use PyTorch-only selective scan (no CUDA extensions)
  pytorch_only: true

# Output postprocessing
postprocessing:
  # Apply scaling factor to output count
  count_scaling_factor: 1.0

  # Density map output format
  density_map:
    # Return density map in output
    include: true
    # Upscale density map to input size
    upscale: false
    # Apply Gaussian smoothing to density map
    smooth: false

# Real-time inference settings (for webcam/stream)
realtime:
  # Target FPS for real-time inference
  target_fps: 10 # Lower than CSRNet due to larger model

  # Maximum FPS (rate limiting)
  max_fps: 30

  # Frame buffer size
  buffer_size: 2

  # Skip frames if processing too slow
  skip_frames: true

  # Display visualization
  display: true

  # Visualization overlay alpha
  overlay_alpha: 0.5

# Caching
cache:
  # Cache model in memory after first load
  cache_model: true

  # Cache preprocessed inputs
  cache_preprocessing: false

  # Cache results (for identical inputs)
  cache_results: false

# Logging
logging:
  # Log inference time
  log_inference_time: true

  # Log memory usage
  log_memory: true

  # Log output statistics
  log_output_stats: false
