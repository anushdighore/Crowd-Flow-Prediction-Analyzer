# CSRNet Model Configuration
# Model-specific settings for CSRNet crowd counting

model:
  # Model identifier
  name: "csrnet"

  # Checkpoint path (relative to project root)
  checkpoint: "ml/checkpoints/csrnet.pth"

  # Model architecture parameters
  architecture:
    # VGG16 frontend pretrained on ImageNet
    frontend: "vgg16"
    # Dilation backend
    backend: "dilated_conv"
    # Output channels (1 for density map)
    output_channels: 1

# Input preprocessing
preprocessing:
  # Dimension settings for different input sources
  # Each source has length (width) and breadth (height) in pixels
  # These values are optimized for CSRNet performance

  image:
    length: 200 # Width for uploaded images
    breadth: 200 # Height for uploaded images

  webcam:
    length: 200 # Width for webcam frames
    breadth: 200 # Height for webcam frames

  video:
    length: 200 # Width for video frames
    breadth: 200 # Height for video frames

  surveillance:
    length: 200 # Width for surveillance camera
    breadth: 200 # Height for surveillance camera

  # Target input size [height, width]
  # CSRNet is fully convolutional, so this is flexible
  # null = keep original size
  input_size: null

  # ImageNet normalization parameters
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  # Resize mode if input_size is set
  resize_mode: "bilinear" # Options: bilinear, bicubic

  # Pad to multiple of (for memory alignment)
  pad_multiple: 16 # CSRNet downsamples by 8x

# Inference settings
inference:
  # Precision mode
  precision: "fp32" # Options: fp32, fp16 (fp16 needs GPU)

  # Batch size for batch inference
  batch_size: 8

  # Enable model warmup on load
  warmup: true

  # Warmup iterations
  warmup_iterations: 3

  # Enable gradient computation (usually false for inference)
  requires_grad: false

# Performance optimization
optimization:
  # Enable torch.compile (PyTorch 2.0+)
  compile_model: false

  # Compilation mode
  compile_mode: "default" # Options: default, reduce-overhead, max-autotune

  # Enable channels_last memory format
  channels_last: false

  # Enable cudnn benchmark
  cudnn_benchmark: true

# Output postprocessing
postprocessing:
  # Apply scaling factor to output count
  # Set to 1.0 if checkpoint is properly calibrated
  # Adjust if over/under counting (e.g., 0.1 if counting 10x too high)
  count_scaling_factor: 1.0

  # Density map output format
  density_map:
    # Return density map in output
    include: true
    # Upscale density map to input size
    upscale: false
    # Apply Gaussian smoothing to density map
    smooth: false

# Real-time inference settings (for webcam/stream)
realtime:
  # Target FPS for real-time inference
  target_fps: 30

  # Maximum FPS (rate limiting)
  max_fps: 60

  # Frame buffer size
  buffer_size: 2

  # Skip frames if processing too slow
  skip_frames: true

  # Display visualization
  display: true

  # Visualization overlay alpha
  overlay_alpha: 0.5

# Caching
cache:
  # Cache model in memory after first load
  cache_model: true

  # Cache preprocessed inputs
  cache_preprocessing: false

  # Cache results (for identical inputs)
  cache_results: false

# Logging
logging:
  # Log inference time
  log_inference_time: true

  # Log memory usage
  log_memory: true

  # Log output statistics
  log_output_stats: false
