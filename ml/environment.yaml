name: crowdenv
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  # Core Python packages
  - python>=3.9
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.13.1
  - pydantic=2.11.9
  - python-dotenv=1.1.1
  - pyyaml=6.0.2
  - requests=2.32.3
  - typing_extensions=4.12.2

  # Computer Vision & Image Processing
  - opencv=4.11.0.86
  - pillow=11.0.0
  - matplotlib=3.9.4
  - seaborn=0.13.2

  # PyTorch ecosystem (will be installed via pip due to CUDA specificity)
  - pip

  # System utilities
  - psutil=6.1.0

  # Pip-only packages (installed after conda packages)
  - pip:
      # PyTorch with CUDA 12.1
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - torchaudio==2.5.1

      # Computer Vision / Training
      - albumentations==2.0.8
      - timm==1.0.20
      - einops==0.8.1

      # YOLO (for sparse crowds)
      - ultralytics==8.3.204
      - ultralytics-thop==2.0.17

      # API (FastAPI inference server)
      - fastapi==0.117.1
      - uvicorn[standard]==0.37.0
      - starlette==0.48.0
      - python-multipart==0.0.20

      # Logging & Monitoring
      - wandb==0.22.2
      - tensorboard==2.20.0

      # Utilities
      - rich==13.9.4
      - tqdm==4.67.1
