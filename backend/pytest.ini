[pytest]
# Put pytest cache in target directory
cache_dir = target/.pytest_cache

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --color=yes
    --tb=short
    --strict-markers
    
# Coverage options (if using pytest-cov)
# --cov=app
# --cov-report=html:target/coverage
# --cov-report=term-missing

# Test paths
testpaths = tests

# Ignore directories
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    target
    __pycache__
